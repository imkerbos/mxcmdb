root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/mxcmdb"
  cmd = "go build -o ./tmp/mxcmdb ./cmd/server/main.go"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "web", "node_modules", "deploy", "migrations", ".git"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  include_dir = []
  include_ext = ["go", "yaml"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
