services:
  api:
    container_name: mxcmdb-api-dev
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.dev
    ports:
      - "10030:10030"
    environment:
      - CONFIG_PATH=/app/deploy/dev/config.yaml
      - TZ=Asia/Shanghai
    volumes:
      - ../../:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    container_name: mxcmdb-web-dev
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.dev
    ports:
      - "3800:3800"
    volumes:
      - ../../web:/app
      - web-node-modules:/app/node_modules
    working_dir: /app
    environment:
      - VITE_API_TARGET=http://api:10030
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3800"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  go-mod-cache:
  go-build-cache:
  web-node-modules:
